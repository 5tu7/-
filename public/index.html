<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرض الصور</title>
<style>
:root{--bg:#eef0ff;--card:#ffffffcc;--tx:#14142b;--mu:#6a6b8a;--ac:#6c5ce7;--ac2:#00c2ff;--bd:#d9dcf5;--ok:#1fb56b;--hero:linear-gradient(135deg,#6c5ce7,#00c2ff)}
[data-theme=dark]{--bg:#0b0b17;--card:#16162ab3;--tx:#f1f1ff;--mu:#9c9dc2;--bd:#2a2a4a}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh;
background:radial-gradient(900px 500px at 85% -10%,#6c5ce744,transparent),radial-gradient(700px 400px at 0% 10%,#00c2ff2e,transparent),var(--bg)}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{margin:0;font-size:26px;background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
.bt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)} .ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--bd)} .ring .fg{stroke:url(#g);transition:stroke-dashoffset .9s linear}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:30px} .mu,.ring span{color:var(--mu);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.chip b{display:block;font-size:20px}
.line{display:flex;justify-content:space-between;font-size:13px;margin-top:12px}
.bar{height:14px;background:var(--bd);border-radius:10px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--hero);border-radius:10px;transition:width .5s;min-width:4px}
.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card));font-weight:700;margin:14px 0 0}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{padding:6px 12px;border-radius:20px;font-size:13px;border:1px solid var(--bd);opacity:.38;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:var(--bg);border-color:var(--ac)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select{font:inherit;border-radius:12px;border:1px solid var(--bd);padding:9px 12px;background:var(--card);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;color:#fff;background:var(--hero)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)} button.r{background:#e5484d} button:active{transform:scale(.94)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ph{padding:0;overflow:hidden;margin:0}
.ph .im{aspect-ratio:1;overflow:hidden;cursor:zoom-in;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s} .ph:hover img{transform:scale(1.07)}
.ph .fv{position:absolute;top:8px;left:8px;background:#0008;color:#fff;padding:4px 8px;border-radius:10px;font-size:16px;cursor:pointer}
.ph .row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:6px}
.ph .t{padding:10px 12px 0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:700px){.two{grid-template-columns:1fr}}
canvas{width:100%;height:150px;display:block}
.feed div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px} td,th{padding:8px 4px;text-align:start;border-bottom:1px solid var(--bd)}
.pop,.cf{position:fixed;pointer-events:none;z-index:60} .pop{font-size:22px;animation:up .8s forwards}
.cf{top:-30px;font-size:22px;animation:fall 2.2s linear forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}} @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:40;overflow:auto;padding:14px}
#lb.on{display:block} .lbw{max-width:760px;margin:0 auto;text-align:center;color:#fff}
.lbw img{max-width:100%;max-height:62vh;border-radius:16px}
.lbw .tools{justify-content:center;margin:10px 0} #cm{text-align:start;background:#fff1;border-radius:14px;padding:10px;max-height:200px;overflow:auto;margin-bottom:8px;font-size:14px}
#cm b{color:var(--ac2)} .cin{display:flex;gap:8px} .cin input{flex:1}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);min-width:280px} dialog::backdrop{background:#0008} dialog input{display:block;width:100%;margin:8px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:70}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<div class="top"><h1>📸 معرض الصور</h1>
  <div class="bt"><span id="who" class="mu"></span>
    <button class="g" id="bSnd">🔔</button><button class="g" id="bTh">🌓</button>
    <button id="bAuth">دخول / تسجيل</button><button class="g" id="bOut" hidden>خروج</button><button class="g" id="bAdm">👑</button></div></div>

<div class="card"><div class="hero">
  <div><div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c5ce7"/><stop offset="1" stop-color="#00c2ff"/></linearGradient></defs>
    <circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="fg" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg>
    <div class="in"><b id="sec">60</b><span>ثانية</span></div></div>
    <div class="mu" id="afk" style="text-align:center;margin-top:6px"></div>
    <div style="text-align:center;margin-top:8px"><button id="bDaily" hidden>🎁 الجائزة اليومية</button></div></div>
  <div style="width:100%"><div class="chips">
    <div class="chip"><b id="mv">0</b><span class="mu">مشاهداتك</span></div><div class="chip"><b id="ml">0</b><span class="mu">لايكاتك</span></div>
    <div class="chip"><b id="av">0</b><span class="mu">مشاهدات الجميع</span></div><div class="chip"><b id="al">0</b><span class="mu">لايكات الجميع</span></div>
    <div class="chip"><b id="rk">🌱</b><span class="mu" id="rkt">الرتبة</span></div><div class="chip"><b id="uc">0</b><span class="mu">المستخدمون</span></div></div>
    <div class="mu" id="rkn" style="margin-top:8px"></div><div class="bar"><i id="br"></i></div></div>
</div></div>

<div class="card"><b id="gt"></b>
  <div class="line"><span>👁 المشاهدات</span><span id="pv"></span></div><div class="bar"><i id="bv"></i></div><div class="mu" id="rv"></div>
  <div class="line"><span>❤️ اللايكات</span><span id="pl"></span></div><div class="bar"><i id="bl"></i></div><div class="mu" id="rl"></div>
  <div class="card win" id="win" hidden></div></div>

<div class="card"><b>🏅 الإنجازات</b><div class="badges" id="badges"></div></div>

<div class="card" id="upl" hidden><b>👑 لوحة المالك</b>
  <div class="tools" style="margin:10px 0 0"><input id="ttl" placeholder="عنوان (اختياري)"><input type="file" id="fl" accept="image/*" multiple><button id="bUp">رفع</button><button class="g" id="bBk">⬇ نسخة احتياطية</button><span class="mu" id="ups"></span></div></div>

<div class="tools">
  <input id="q" placeholder="🔎 بحث" style="flex:1;min-width:120px">
  <select id="sort"><option value="new">الأحدث</option><option value="likes">الأكثر لايكات</option><option value="views">الأكثر مشاهدة</option></select>
  <select id="flt"><option value="all">كل الصور</option><option value="fav">⭐ المفضلة</option></select>
  <select id="mult"><option value="1">❤️ ×1</option><option value="10">❤️ ×10</option><option value="100">❤️ ×100</option><option value="1000">❤️ ×1000</option></select></div>
<div class="grid" id="grid"></div><p class="mu" id="empty" hidden>لا توجد صور.</p>

<div class="two" style="margin-top:16px">
  <div class="card"><b>📈 آخر 7 أيام</b> <span class="mu">(<span style="color:#6c5ce7">■</span> مشاهدات <span style="color:#00c2ff">■</span> لايكات)</span><canvas id="cv"></canvas></div>
  <div class="card feed"><b>⚡ النشاط المباشر</b><div id="feed"></div></div></div>
<div class="card"><b>🏆 المتصدرون</b><table><thead><tr><th>#</th><th>الاسم</th><th>مشاهدات</th><th>لايكات</th></tr></thead><tbody id="top"></tbody></table></div>
</main>

<div id="lb"><div class="lbw"><img id="lbi" alt=""><div id="lbt" style="margin:8px 0;font-weight:700"></div><div class="mu" id="lbs"></div>
  <div class="tools"><button class="g" id="lbP">→</button><button id="lbL">❤️ أعجبني</button><button class="g" id="lbF">⭐</button><button class="g" id="lbS">🔗 مشاركة</button><a id="lbD" download><button class="g" type="button">⬇ تحميل</button></a><button class="g" id="lbN">←</button><button class="g" id="lbC">✕</button></div>
  <div id="cm"></div><div class="cin"><input id="ci" placeholder="اكتب تعليقاً..." maxlength="200"><button id="cs">إرسال</button></div></div></div>
<dialog id="dlg"><b id="dt"></b><input id="du" placeholder="اسم المستخدم"><input id="dp" type="password" placeholder="كلمة السر">
  <div class="tools"><button id="d1">موافق</button><button class="g" id="d2">تسجيل جديد</button><button class="g" id="d3">إلغاء</button></div></dialog>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id), fmt=n=>(n||0).toLocaleString('ar-EG'), C=339.3;
const RANKS=[[0,'مبتدئ','🌱'],[1e3,'برونزي','🥉'],[1e4,'فضي','🥈'],[1e5,'ذهبي','🥇'],[1e6,'بلاتيني','💎'],[1e7,'أسطوري','🔥'],[1e8,'ملك','👑']];
const ACH=[['لايكك الأول','❤️',m=>m.likes>=1],['ألف لايك','🌟',m=>m.likes>=1e3],['100 ألف لايك','⚡',m=>m.likes>=1e5],['مليون لايك','🏆',m=>m.likes>=1e6],
 ['ألف مشاهدة','👀',m=>m.views>=1e3],['100 ألف مشاهدة','🚀',m=>m.views>=1e5],['مليون مشاهدة','🌍',m=>m.views>=1e6],['الهدف الكبير','🎁',(m,g)=>m.views>=g&&m.likes>=g]];
let S={photos:[],top:[],days:[],events:[],me:null,goal:1e8,afkSeconds:60,afkGain:100,dailyGain:1000}, token=localStorage.tk||'', busy=false, tick=0, dailyAt=0, curId=null, order=[], mode='login', snd=localStorage.snd!=='0', firstAch=true;
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
let ac; const beep=(f=660,d=.09)=>{if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}};
const confetti=()=>{for(let i=0;i<32;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','✨','🎊','⭐'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.append(s);setTimeout(()=>s.remove(),3000)}};
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{...(opt.headers||{}),'x-token':token}}); let d;
  try{d=await r.json()}catch{toast('لا يوجد خادم! شغّل الموقع عبر Node.js (server.js) وليس كملفات ثابتة');throw{error:null}}
  if(!r.ok){toast(d.error||'خطأ');throw d} return d;
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const setS=s=>{S=s;dailyAt=Date.now()+(S.me?S.me.dailyIn:0)};

function render(){
  const m=S.me||{views:0,likes:0}, g=S.goal;
  $('mv').textContent=fmt(m.views);$('ml').textContent=fmt(m.likes);$('av').textContent=fmt(S.totalViews);$('al').textContent=fmt(S.totalLikes);$('uc').textContent=fmt(S.usersCount);
  let ri=0;RANKS.forEach((r,i)=>{if(m.likes>=r[0])ri=i});const nx=RANKS[ri+1];
  $('rk').textContent=RANKS[ri][2];$('rkt').textContent='الرتبة: '+RANKS[ri][1];
  $('rkn').textContent=nx?'للرتبة التالية ('+nx[2]+' '+nx[1]+') باقي '+fmt(nx[0]-m.likes)+' لايك':'وصلت لأعلى رتبة 👑';
  $('br').style.width=(nx?(m.likes-RANKS[ri][0])/(nx[0]-RANKS[ri][0])*100:100)+'%';
  $('gt').textContent='🎁 الهدف: '+fmt(g)+' مشاهدة + '+fmt(g)+' لايك = نيترو ديسكورد';
  const pv=Math.min(100,m.views/g*100),pL=Math.min(100,m.likes/g*100);
  $('bv').style.width=pv+'%';$('bl').style.width=pL+'%';$('pv').textContent=pv.toFixed(4)+'%';$('pl').textContent=pL.toFixed(4)+'%';
  $('rv').textContent='المتبقي: '+fmt(Math.max(0,g-m.views))+' مشاهدة';$('rl').textContent='المتبقي: '+fmt(Math.max(0,g-m.likes))+' لايك';
  const won=S.me&&m.views>=g&&m.likes>=g;$('win').hidden=!won;
  if(won)$('win').innerHTML='🎉 مبروك! حققت الشرط، راسلني على تيليجرام: <a href="https://t.me/'+S.telegram+'" target="_blank">@'+S.telegram+'</a>';
  $('who').textContent=S.admin?'👑 مالك':S.me?'👤 '+S.me.name:'زائر';
  $('bAuth').hidden=!!(S.me||S.admin);$('bOut').hidden=!(S.me||S.admin);$('bAdm').hidden=S.admin;$('upl').hidden=!S.admin;$('bDaily').hidden=!S.me;
  // إنجازات
  const key='ach_'+(S.me?S.me.name:''),seen=JSON.parse(localStorage[key]||'[]'),bd=$('badges');bd.textContent='';let fresh=[];
  ACH.forEach((a,i)=>{const on=S.me&&a[2](m,g),s=document.createElement('span');s.className='badge'+(on?' on':'');s.textContent=a[1]+' '+a[0];bd.append(s);if(on&&!seen.includes(i))fresh.push(i)});
  if(S.me&&fresh.length){localStorage[key]=JSON.stringify([...seen,...fresh]);if(!firstAch){toast('🏅 إنجاز جديد: '+ACH[fresh[0]][0]);confetti();beep(880,.25)}}
  if(S.me)firstAch=false;
  // الصور
  const q=$('q').value.trim().toLowerCase(),s=$('sort').value;
  let list=S.photos.filter(p=>(!q||(p.title||'').toLowerCase().includes(q))&&($('flt').value==='all'||p.fav));
  list.sort((a,b)=>s==='likes'?b.likes-a.likes:s==='views'?b.views-a.views:b.ts-a.ts);order=list.map(p=>p.id);
  const gr=$('grid');gr.textContent='';
  list.forEach(p=>{
    const d=document.createElement('div');d.className='card ph';
    const w=document.createElement('div');w.className='im';w.onclick=()=>openLb(p.id);
    const im=document.createElement('img');im.src='/uploads/'+p.file;im.loading='lazy';im.alt='';
    const fv=document.createElement('span');fv.className='fv';fv.textContent=p.fav?'⭐':'☆';fv.onclick=e=>{e.stopPropagation();fav(p.id)};w.append(im,fv);d.append(w);
    if(p.title){const t=document.createElement('div');t.className='t';t.textContent=p.title;d.append(t)}
    const row=document.createElement('div');row.className='row';
    const c=document.createElement('span');c.className='mu';c.textContent='❤️ '+fmt(p.likes)+'  👁 '+fmt(p.views)+'  💬 '+fmt(p.comments.length);
    const b=document.createElement('button');b.textContent='أعجبني';b.onclick=e=>like(p.id,e);row.append(c,b);d.append(row);
    if(S.admin){const x=document.createElement('button');x.className='r';x.style.cssText='margin:0 12px 12px';x.textContent='حذف';x.onclick=()=>del(p.id);d.append(x)}
    gr.append(d);
  });
  $('empty').hidden=!!list.length;
  const fd=$('feed');fd.textContent='';S.events.forEach(e=>{const d=document.createElement('div');d.textContent=e.u+' '+e.text;fd.append(d)});
  const tb=$('top');tb.textContent='';S.top.forEach((u,i)=>{const tr=document.createElement('tr');[i+1,u.name,fmt(u.views),fmt(u.likes)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tb.append(tr)});
  chart();refreshLb();
}
function chart(){
  const c=$('cv'),W=c.width=c.clientWidth*2,H=c.height=300,x=c.getContext('2d'),mx=Math.max(1,...S.days.flatMap(d=>[d.views,d.likes])),bw=W/S.days.length;
  x.clearRect(0,0,W,H);x.font='22px sans-serif';x.fillStyle=getComputedStyle(document.body).color;x.textAlign='center';
  S.days.forEach((d,i)=>{const h1=(d.views/mx)*(H-50),h2=(d.likes/mx)*(H-50),cx=i*bw+bw/2;
    x.fillStyle='#6c5ce7';x.fillRect(cx-26,H-30-h1,24,h1);x.fillStyle='#00c2ff';x.fillRect(cx+2,H-30-h2,24,h2);
    x.fillStyle=getComputedStyle(document.body).color;x.fillText(d.day,cx,H-6)});
}
async function like(id,ev){
  if(!S.me){toast('سجّل دخولك أولاً');return openDlg()}
  const n=+$('mult').value,p=S.photos.find(x=>x.id===id);beep(520+Math.random()*200,.06);
  if(ev){const f=document.createElement('span');f.className='pop';f.textContent='❤️';f.style.left=ev.clientX+'px';f.style.top=ev.clientY+'px';document.body.append(f);setTimeout(()=>f.remove(),800)}
  p.likes+=n;p.mine+=n;S.me.likes+=n;S.totalLikes+=n;render();
  busy=true;try{setS(await post('/api/like',{photoId:id,n}));render()}catch{}busy=false;
}
async function fav(id){if(!S.me){toast('سجّل دخولك أولاً');return openDlg()}try{setS(await post('/api/fav',{photoId:id}));render()}catch{}}
async function view(photoId){try{setS(await post('/api/view',{photoId}));render()}catch{}}
// عرض الصورة
const P=()=>S.photos.find(p=>p.id===curId);
function openLb(id){curId=id;$('lb').classList.add('on');history.replaceState(null,'','#p='+id);view(id)}
function closeLb(){curId=null;$('lb').classList.remove('on');history.replaceState(null,'',location.pathname)}
function nav(d){const i=order.indexOf(curId);if(i<0)return;openLb(order[(i+d+order.length)%order.length])}
function refreshLb(){
  const p=P();if(!p){if(curId)closeLb();return}
  $('lbi').src='/uploads/'+p.file;$('lbt').textContent=p.title||'';$('lbs').textContent='❤️ '+fmt(p.likes)+'   👁 '+fmt(p.views);
  $('lbF').textContent=p.fav?'⭐ في المفضلة':'☆ مفضلة';$('lbD').href='/uploads/'+p.file;
  const cm=$('cm');cm.textContent='';if(!p.comments.length)cm.textContent='لا توجد تعليقات بعد';
  p.comments.forEach(c=>{const d=document.createElement('div'),b=document.createElement('b');b.textContent=c.u+': ';d.append(b,document.createTextNode(c.t));cm.append(d)});
}
$('lbL').onclick=e=>like(curId,e);$('lbF').onclick=()=>fav(curId);$('lbC').onclick=closeLb;$('lbN').onclick=()=>nav(1);$('lbP').onclick=()=>nav(-1);
$('lbS').onclick=()=>{navigator.clipboard.writeText(location.origin+location.pathname+'#p='+curId).then(()=>toast('تم نسخ الرابط 🔗'))};
$('cs').onclick=async()=>{if(!S.me){toast('سجّل دخولك أولاً');return openDlg()}const t=$('ci').value.trim();if(!t)return;try{setS(await post('/api/comment',{photoId:curId,text:t}));$('ci').value='';render();$('cm').scrollTop=1e6}catch{}};
$('ci').onkeydown=e=>{if(e.key==='Enter')$('cs').click()};
let tx=0;$('lb').ontouchstart=e=>tx=e.touches[0].clientX;$('lb').ontouchend=e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70)nav(d<0?1:-1)};
document.onkeydown=e=>{if(!curId||e.target.tagName==='INPUT')return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')nav(1);if(e.key==='ArrowRight')nav(-1)};
// حساب
function openDlg(m='login'){mode=m;$('dt').textContent=m==='admin'?'دخول المالك':'تسجيل الدخول';$('du').hidden=m==='admin';$('d2').hidden=m==='admin';$('dlg').showModal()}
async function submit(kind){try{const r=mode==='admin'?await post('/api/admin',{pass:$('dp').value}):await post('/api/'+kind,{name:$('du').value.trim(),pass:$('dp').value});
  token=r.token;localStorage.tk=token;$('dlg').close();$('dp').value='';firstAch=true;await refresh();if(S.me)view()}catch{}}
function logout(silent){token='';localStorage.removeItem('tk');if(!silent)toast('تم الخروج');refresh()}
$('bAuth').onclick=()=>openDlg();$('bAdm').onclick=()=>openDlg('admin');$('bOut').onclick=()=>logout();
$('d1').onclick=()=>submit(mode==='admin'?'admin':'login');$('d2').onclick=()=>submit('register');$('d3').onclick=()=>$('dlg').close();
// مالك
$('bUp').onclick=async()=>{const fs=[...$('fl').files];if(!fs.length)return toast('اختر صوراً');
  for(let i=0;i<fs.length;i++){$('ups').textContent='جاري الرفع '+(i+1)+'/'+fs.length;
    try{setS(await api('/api/upload',{method:'POST',headers:{'x-filename':encodeURIComponent(fs[i].name),'x-title':encodeURIComponent($('ttl').value)},body:fs[i]}))}catch{break}}
  $('ups').textContent='تم ✓';$('fl').value='';$('ttl').value='';render()};
async function del(id){if(confirm('حذف الصورة؟')){setS(await api('/api/photo/'+id,{method:'DELETE'}));render()}}
$('bBk').onclick=async()=>{const r=await fetch('/api/backup',{headers:{'x-token':token}}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup.json';a.click()};
// الجائزة اليومية
$('bDaily').onclick=async()=>{try{setS(await post('/api/daily'));render();toast('🎁 +'+fmt(S.dailyGain)+' مشاهدة ولايك!');confetti();beep(990,.3)}catch{}};
// AFK + عدّاد الجائزة
function ringUI(){
  const N=S.afkSeconds;$('fg').style.strokeDashoffset=C*(1-tick/N);$('sec').textContent=N-tick;
  $('afk').textContent=!S.me?'سجّل دخولك لتشغيل AFK':document.hidden?'⏸ متوقف (ارجع للصفحة)':'AFK يعمل ✅ كل دقيقة = +'+S.afkGain+' مشاهدة و +'+S.afkGain+' لايك';
  const left=dailyAt-Date.now();$('bDaily').disabled=left>0;
  $('bDaily').textContent=left>0?'🎁 بعد '+new Date(left).toISOString().substr(11,8):'🎁 استلم الجائزة اليومية';
}
setInterval(async()=>{
  if(!S.me||document.hidden)return ringUI();
  if(++tick>=S.afkSeconds){tick=0;try{setS(await post('/api/afk'));render();beep(740,.12)}catch{}}
  ringUI();
},1000);
// إعدادات
const th=d=>{document.documentElement.dataset.theme=d;localStorage.th=d;chart()};
$('bTh').onclick=()=>th(document.documentElement.dataset.theme==='dark'?'light':'dark');
th(localStorage.th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('bSnd').onclick=()=>{snd=!snd;localStorage.snd=snd?1:0;$('bSnd').textContent=snd?'🔔':'🔕'};$('bSnd').textContent=snd?'🔔':'🔕';
['q','sort','flt'].forEach(i=>$(i).oninput=render);
async function refresh(){if(busy)return;try{setS(await api('/api/state'));render()}catch(e){if(e.error)logout(true)}}
(async()=>{await refresh();if(S.me)view();const h=location.hash.match(/p=(\w+)/);if(h&&S.photos.some(p=>p.id===h[1]))openLb(h[1]);setInterval(refresh,6000);ringUI()})();
</script>
</body>
</html>
